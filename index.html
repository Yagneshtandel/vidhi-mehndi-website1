   <!DOCTYPE html>
<html>
<head>
  <title>Vidhi Mehndi Artist 🌸</title>

  <style>
    body {
      background: linear-gradient(to bottom, #ffe4ec, #ffffff);
      text-align: center;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .logo {
      width: 90px;
      margin-top: 15px;
      border-radius: 50%;
      box-shadow: 0 0 10px pink;
    }

    h2 {
      color: #ff2e75;
      margin: 10px 0;
    }

    /* GRID LAYOUT */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }

    .card {
      width: 300px;
      margin: 12px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .caption {
      padding: 10px;
      color: #ff2e75;
      font-weight: bold;
    }

    /* BUTTONS */
    .btn {
      display: inline-block;
      margin: 10px 5px;
      padding: 10px 18px;
      border-radius: 25px;
      text-decoration: none;
      color: white;
      font-size: 14px;
      transition: 0.3s;
    }

    .insta {
      background: #ff2e75;
    }

    .map {
      background: #ff99cc;
    }

    .btn:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
